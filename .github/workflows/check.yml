# Every pull request and every push to main or next: the plugin validates, its tests pass, and it hooks and calls only what is listed.
name: check

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The version the tests are known to pass on. Raise it together with the README's "Built and tested on".
      CLAUDE_CODE_VERSION: 2.1.321
      DISABLE_AUTOUPDATER: 1
      DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      # Neither command needs an account: they read the folder and run the tests locally.
      - name: Validate
        run: claude plugin validate .
      - name: Test
        run: claude plugin test .
      # What the mod hooks and calls is what scripts/surface.txt lists, and nothing that reaches outside the session.
      - name: Surface
        run: node scripts/check-surface.mjs
